name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.1)'
        required: true
        default: '1.0.0'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Update Version Name and Code
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          VERSION_CODE=$(git rev-list --count HEAD)
          sed -i "s/versionName = .*/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Build Release APK & Bundle
        run: ./gradlew assembleRelease bundleRelease

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Release v${{ env.VERSION_NAME }}
          generate_release_notes: true
          body: |
            ## Release v${{ env.VERSION_NAME }}
            Versão oficial do Geny Assistant.
            
            ### Downloads
            * [Download APK](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/app-release-unsigned.apk) ![Badge](https://img.shields.io/badge/Download-APK-blue?style=flat-square&logo=android)
            * [Download AAB](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/app-release-unsigned.aab) ![Badge](https://img.shields.io/badge/Download-AAB-orange?style=flat-square&logo=android)
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release-unsigned.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
