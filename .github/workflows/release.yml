name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.1)'
        required: true
        default: '1.0.0'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Update Version Name and Code
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          VERSION_CODE=$(git rev-list --count HEAD)
          sed -i "s/versionName = .*/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Decode Keystore
        run: |
          if [ ! -z "${{ secrets.KEYSTORE_FILE }}" ]; then
            echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/release.keystore
            echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
          else
            echo "Erro: KEYSTORE_FILE secret não configurada."
            exit 1
          fi

      - name: Build Release APK & Bundle
        run: ./gradlew assembleRelease bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate Changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" -10)
          else
            CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"* %s (%h)")
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: 🚀 Geny Assistant v${{ env.VERSION_NAME }}
          body: |
            # 🚀 Geny Assistant - Versão v${{ env.VERSION_NAME }}
            
            Bem-vindo à nova versão do Geny Assistant!
            
            ### 📝 O que mudou nesta versão?
            ${{ env.CHANGELOG }}
            
            ### 📥 Downloads Oficiais
            
            | Arquivo | Link de Download | Badge |
            | :--- | :--- | :--- |
            | **Android APK** | [Baixar APK](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/app-release.apk) | [![Download APK](https://img.shields.io/badge/Download-APK-blue?style=flat-square&logo=android)](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/app-release.apk) |
            | **Android App Bundle** | [Baixar AAB](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/app-release.aab) | [![Download AAB](https://img.shields.io/badge/Download-AAB-orange?style=flat-square&logo=android)](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/app-release.aab) |
            
            ---
            **Informações Técnicas:**
            - **Versão:** ${{ env.VERSION_NAME }}
            - **Build Code:** ${{ env.VERSION_CODE }}
            - **Data:** $(date +'%d/%m/%Y')
            
            *Desenvolvido com tecnologia LiveKit e Firebase.*
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
