name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.1)'
        required: true
        default: '1.0.0'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Update Version Name and Code
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          VERSION_CODE=$(git rev-list --count HEAD)
          sed -i "s/versionName = .*/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/release.keystore
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV

      - name: Build Release APK & Bundle
        run: ./gradlew assembleRelease bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate Changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --oneline)
          else
            CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --oneline)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Release v${{ env.VERSION_NAME }}
          body: |
            ## 🚀 Release v${{ env.VERSION_NAME }}
            Versão oficial do Geny Assistant.
            
            ### 📝 O que mudou?
            ${{ env.CHANGELOG }}
            
            ### 📥 Downloads
            * [Download APK](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/app-release.apk) ![Badge](https://img.shields.io/badge/Download-APK-blue?style=flat-square&logo=android)
            * [Download AAB](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/app-release.aab) ![Badge](https://img.shields.io/badge/Download-AAB-orange?style=flat-square&logo=android)
            
            ---
            *Build Code: ${{ env.VERSION_CODE }}*
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
