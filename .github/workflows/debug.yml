name: Android Debug CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/release.yml'

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bump version code
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Generate Changelog
        id: changelog
        uses: Jay-Khuu/github-tag-action@v1.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          custom_tag: debug-${{ env.VERSION_CODE }}
          tag_prefix: ""

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ env.VERSION_CODE }}
          name: Debug Build #${{ env.VERSION_CODE }}
          body: |
            ## Debug Build
            Esta é uma build automática de debug.
            
            [Download APK](https://github.com/${{ github.repository }}/releases/download/debug-${{ env.VERSION_CODE }}/app-debug.apk)
            
            ![Badge](https://img.shields.io/badge/Download-APK-blue?style=for-the-badge&logo=android)
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
