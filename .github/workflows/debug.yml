name: Android Debug CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/release.yml'

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Bump version code
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Decode Keystore
        if: env.KEYSTORE_FILE != ''
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/release.keystore
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate Changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --oneline)
          else
            CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --oneline)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ env.VERSION_CODE }}
          name: Debug Build #${{ env.VERSION_CODE }}
          body: |
            ## 🛠 Debug Build #${{ env.VERSION_CODE }}
            
            ### 📝 Changelog
            ${{ env.CHANGELOG }}
            
            ### 📥 Downloads
            * [Download APK](https://github.com/${{ github.repository }}/releases/download/debug-${{ env.VERSION_CODE }}/app-debug.apk)
            
            ![Badge](https://img.shields.io/badge/Download-APK-blue?style=for-the-badge&logo=android)
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
